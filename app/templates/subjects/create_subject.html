{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="flex">
        <a class="back-link" href="{{ request.url_for('transition_to_subjects') }}" title="Вернуться назад">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Назад
        </a>

        <h1 class="page-title">Новая дисциплина</h1>
    </div>

    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label>Название дисциплины</label>
                <input type="text" name="name" value="{{ name or '' }}" minlength="1" maxlength="255" required>
            </div>

            <div class="form-group">
                <label>Тип аудитории</label>
                <input type="text" name="room_type" placeholder="Например: Лекционная, Лаборатория, Спортзал" value="{{ room_type or '' }}" minlength="1" maxlength="50" required>
            </div>

            <button type="submit" class="btn-success">Сохранить</button>
        </form>

        {% if errors %}
            <div class="alert">
                {% for error in errors %}
                    <div class="alert-danger">
                        {{ error }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
