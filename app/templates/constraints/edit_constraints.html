{% extends 'base.html' %}
{% block content %}
<div class="container">

    <div class="flex">
        <a class="back-link" href="{{ request.url_for('transition_to_constraints')}}" title="Вернуться назад">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Назад
        </a>
        
        <h1 class="page-title">Редактирование ограничения</h1>
    </div>

    <div class="form-card">
        <form method="POST">

            <div class="form-group">
                <label>Преподаватель</label>

                <select name="teacher_id" required>
                    {% for teacher in teachers %}
                    <option value="{{ teacher.id }}" {% if teacher.id == constraint.teacher_id %} selected {% endif %}>{{ teacher.full_name }}</option>
                    {% endfor %}
                </select>

            </div>

            <div class="form-group">
                <label>Временной слот</label>

                <select name="timeslot_id" required>
                    {% for slot in timeslots %}
                    <option value="{{ slot.id }}" {% if slot.id == constraint.timeslot_id %} selected {% endif %}>
                        {{ slot.day_of_week }} — {{ slot.lesson_number }} пара
                    </option>
                    {% endfor %}
                </select>

            </div>

            <div class="form-group">

                <label>Тип ограничения</label>

                <input type="text" name="constraint_type" value="{{ constraint.constraint_type }}" minlength="1" maxlength="50" required>

            </div>

            <button type="submit" class="btn-success">Сохранить</button>

        </form>

        {% if errors %}
            <div class="alert">
                {% for error in errors %}
                    <div class="alert-danger">
                        {{ error }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
    </div>
</div>
{% endblock %}
