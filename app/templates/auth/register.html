{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Регистрация</h1>

        <form method="POST" class="auth-form">

            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" value="{{ username or '' }}" minlength="1" maxlength="50" required>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" value="{{ password or '' }}" minlength="7" required>
            </div>

            <button type="submit" class="auth-btn">Зарегистрироваться</button>

        </form>
        
        {% if errors %}
            <div class="alert">
                {% for error in errors %}
                    <div class="alert-danger">
                        {{ error }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="auth-link">
            Есть аккаунт? -
            <a href="{{ request.url_for('transition_to_login') }}">войти</a>
        </div>
    </div>
</div>

{% endblock %}
