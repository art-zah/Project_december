{% extends 'base.html' %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Вход в систему</h1>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" value="{{ username or '' }}" required>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="auth-btn">Войти</button>
        </form>

        {% if errors %}
            <div class="alert">
                {% for error in errors %}
                    <div class="alert-danger">
                        {{ error }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="auth-link">
            Нет аккаунта? -
            <a href="{{ request.url_for('transition_to_register') }}">Зарегистрироваться</a>
        </div>
    </div>
</div>

{% endblock %}
