{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="flex">
        <a class="back-link" href="{{ request.url_for('transition_to_teacher_subjects') }}" title="Вернуться назад">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Назад
        </a>

        <h1 class="page-title">Редактирование связи</h1>
    </div>

    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label>Преподаватель</label>
                <select name="teacher_id" required>
                    {% for teacher in teachers %}
                    <option value="{{ teacher.id }}" {% if teacher_subject and teacher.id == teacher_subject.teacher_id %} selected {% endif %}>
                        {{ teacher.full_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Предмет</label>
                <select name="subject_id" required>
                    {% for subject in subjects %}
                    <option value="{{ subject.id }}" {% if teacher_subject and subject.id == teacher_subject.subject_id %} selected {% endif %}>
                        {{ subject.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn-success">Сохранить</button>
        </form>

        {% if errors %}
            <div class="alert">
                {% for error in errors %}
                    <div class="alert-danger">
                        {{ error }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
    </div>
</div>
{% endblock %}
