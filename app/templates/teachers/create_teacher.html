{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="flex">
        <a class="back-link" href="{{ request.url_for('transition_to_teachers')}}" title="Вернуться назад">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Назад
        </a>
        
        <h1 class="page-title">Новый преподаватель</h1>
    </div>

    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label>ФИО</label>
                <input type="text" name="full_name" value="{{ full_name or '' }}" minlength="1" maxlength="255" required>
            </div>

            <div class="form-group">
                <label>Телефон</label>
                <input type="text" name="phone" value="{{ phone or '' }}" maxlength="20">
            </div>

            <div class="form-group">
                <label>Макс. пар в день</label>
                <input type="number" name="max_lessons_per_day" value="{{ max_lessons_per_day or '4' }}" min="1" required>
            </div>

            <button type="submit" class="btn-success">Сохранить</button>

        </form>

        {% if errors %}
            <div class="alert">
                {% for error in errors %}
                    <div class="alert-danger">
                        {{ error }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

    </div>
</div>
{% endblock %}
