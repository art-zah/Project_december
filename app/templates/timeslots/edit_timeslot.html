{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="flex">
        <a class="back-link" href="{{ request.url_for('transition_to_timeslots')}}" title="Вернуться назад">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Назад
        </a>
        
        <h1 class="page-title">Редактирование временного слота</h1>
    </div>

    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label>День недели</label>
                <input type="text" name="day_of_week" value="{{ timeslot.day_of_week }}" minlength="1" maxlength="20" required>
            </div>
            <div class="form-group">
                <label>Номер пары</label>
                <input type="number" name="lesson_number" value="{{ timeslot.lesson_number }}" min="1" required>
            </div>
            <div class="form-group">
                <label>Начало</label>
                <input type="time" name="start_time" value="{{ timeslot.start_time }}" required>
            </div>
            <div class="form-group">
                <label>Конец</label>
                <input type="time" name="end_time" value="{{ timeslot.end_time }}" required>
            </div>

            <button type="submit" class="btn-success">Сохранить</button>

        </form>

        {% if errors %}
            <div class="alert">
                {% for error in errors %}
                    <div class="alert-danger">
                        {{ error }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

    </div>
</div>
{% endblock %}
